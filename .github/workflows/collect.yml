name: Collect Potover sources
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm run collect
      - name: Update D1 through Potover API
        env:
          POTOVER_API_URL: ${{ secrets.POTOVER_API_URL }}
          POTOVER_INGEST_TOKEN: ${{ secrets.POTOVER_INGEST_TOKEN }}
        run: |
          curl --fail-with-body -X POST "$POTOVER_API_URL/api/articles" \
            -H "Authorization: Bearer $POTOVER_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @output/articles.json
